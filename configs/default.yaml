seed: 42

data:
  webqa_jsonl: "data/webqa/webqa_adv.jsonl"
  webqa_images_tsv: "data/webqa/images/imgs.tsv"
  webqa_images_lineidx: "data/webqa/images/imgs.lineidx"
  # Data splits
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

clip:
  model_name: "ViT-L-14"
  pretrained: "openai"
  embed_dim: 768
  batch_size: 256
  device: "cuda"

retrieval:
  top_k_values: [1, 3, 5, 10, 20]
  default_top_k: 5
  embeddings_dir: "results/embeddings"

verification:
  # Threshold-based classifier
  threshold:
    search_range: [0.1, 0.95]
    search_steps: 50
  # MLP classifier
  mlp:
    input_mode: "features"   # "features" (6-dim) or "embeddings" (1536-dim)
    hidden_dims: [512, 256]
    dropout: 0.3
    num_classes: 3
    learning_rate: 0.001
    weight_decay: 0.0001
    batch_size: 64
    num_epochs: 50
    early_stopping_patience: 7
    class_weights: [1.0, 0.73, 8.0]  # inverse of class ratios roughly

text:
  bm25:
    top_k_values: [1, 3, 5, 10]
    default_top_k: 5
  nli:
    model_name: "MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli"
    batch_size: 32
    max_seq_length: 512

fusion:
  type: "score"  # "score" or "gated"
  hidden_dims: [256, 128]
  learning_rate: 0.001
  batch_size: 64
  num_epochs: 50
  early_stopping_patience: 7
  class_weights: [1.0, 0.73, 8.0]

results:
  base_dir: "results"
  figures_dir: "results/figures"
  metrics_dir: "results/metrics"
  embeddings_dir: "results/embeddings"
  checkpoints_dir: "results/checkpoints"
  experiments_dir: "results/experiments"

logging:
  level: "INFO"
  log_dir: "results/logs"
  tensorboard_dir: "results/tensorboard"
